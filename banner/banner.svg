    <path class="draw" pathLength="100" d="M841.0 191.4L855.9 108.9" fill="none" stroke="#3c6013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:0.96s"/>
    <path class="draw" pathLength="100" d="M841.0 191.4L937.8 195.6" fill="none" stroke="#3c6013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.18s"/>
    <path class="draw" pathLength="100" d="M937.8 195.6L1025.9 206.0" fill="none" stroke="#3c6013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.40s"/>
    <path class="draw" pathLength="100" d="M1025.9 206.0L1009.6 136.7" fill="none" stroke="#3c6013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.62s"/>
    <path class="draw" pathLength="100" d="M1009.6 136.7L1103.8 149.8" fill="none" stroke="#3c6013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.84s"/>
    <path class="draw" pathLength="100" d="M1103.8 149.8L1124.0 44.8" fill="none" stroke="#3c6013" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.06s"/>
    <circle class="arrive" style="animation-delay:0.15s" cx="770.9" cy="69.8" r="8.0" fill="#65a30d"/>
    <circle class="arrive" style="animation-delay:0.39s" cx="749.3" cy="202.0" r="5.0" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:0.63s" cx="1009.6" cy="136.7" r="5.3" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:0.87s" cx="1103.8" cy="149.8" r="4.3" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:1.11s" cx="855.9" cy="108.9" r="5.5" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:1.35s" cx="1025.9" cy="206.0" r="3.8" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:1.59s" cx="717.7" cy="141.7" r="4.1" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:1.83s" cx="937.8" cy="195.6" r="6.0" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:2.07s" cx="841.0" cy="191.4" r="5.4" fill="#afd476"/>
    <circle class="arrive" style="animation-delay:2.31s" cx="1124.0" cy="44.8" r="5.6" fill="#afd476"/>
    <rect x="0.0" y="248" width="300.5" height="12" fill="#365314"/><rect x="300.0" y="248" width="300.5" height="12" fill="#4d7c0f"/><rect x="600.0" y="248" width="300.5" height="12" fill="#65a30d"/><rect x="900.0" y="248" width="300.5" height="12" fill="#ecfccb"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="83.2" fill="#65a30d" font-size="15" font-weight="700" letter-spacing=".6">Wilson's Lawn Maintenance</text><text x="56" y="129.6" fill="#ecfccb" font-size="40" font-weight="700" letter-spacing="-.5">the reading room, for visitors</text><text x="56" y="170.2" fill="#cfdeb2" font-size="23">What the business has chosen to share.</text></g>
  </g>
</svg>
